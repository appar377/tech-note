<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lambda API entry and TypeScript handler</title>
  <desc id="desc">An HTTP request passes through API Gateway to a JavaScript handler. TypeScript is compiled before deployment.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111A"/><stop offset="1" stop-color="#16382F"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#71D7BA"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <path d="M720 0L1200 200V675H920L580 80Z" fill="#34D399" opacity=".08"/>
  <rect x="28" y="28" width="1144" height="619" rx="34" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <g font-family="Inter, system-ui, -apple-system, Arial, sans-serif">
    <rect x="72" y="72" width="204" height="42" rx="21" fill="#fff" fill-opacity=".1"/>
    <text x="96" y="100" fill="#DDE6F3" font-size="22" font-weight="700">AWS / Lambda</text>
    <text x="72" y="214" fill="#fff" font-size="64" font-weight="800">API entry</text>
    <text x="72" y="288" fill="#fff" font-size="64" font-weight="800">&amp; handler</text>
    <path d="M74 350H334" stroke="#71D7BA" stroke-width="9" stroke-linecap="round"/>
    <text x="72" y="414" fill="#CBD5E1" font-size="28">TypeScript → JavaScript</text>
    <text x="72" y="456" fill="#CBD5E1" font-size="28">Build, deploy, invoke</text>
    <g fill="#0C1C25" stroke="#52766F" stroke-width="2">
      <rect x="594" y="136" width="490" height="98" rx="22"/>
      <rect x="594" y="288" width="490" height="98" rx="22"/>
      <rect x="594" y="440" width="490" height="98" rx="22"/>
    </g>
    <g fill="#E2E8F0" font-size="30" font-weight="700" text-anchor="middle">
      <text x="839" y="195">HTTP request</text>
      <text x="839" y="347">API Gateway</text>
      <text x="839" y="499">JavaScript handler</text>
    </g>
    <path d="M839 244V276M839 396V428" stroke="#71D7BA" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="839" y="586" fill="#A7C5BE" font-size="23" text-anchor="middle">event → response</text>
  </g>
</svg>
