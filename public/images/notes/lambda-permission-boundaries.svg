<svg xmlns="http://www.w3.org/2000/svg" width="640" height="564" viewBox="0 0 640 564" role="img" aria-labelledby="title description">
  <title id="title">Lambdaの権限を3つの関係で確認する</title>
  <desc id="description">信頼ではLambdaサービスと実行ロール、操作許可では実行ロールとS3、対象認可では認証済み利用者と文書の関係を見る。3行は処理順を表さない。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="640" height="564" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#0f172a">
    <text x="32" y="48" font-size="28" font-weight="700">誰と何の関係を確認するか</text>
    <rect x="24" y="76" width="592" height="128" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="44" y="111" font-size="26" font-weight="700">1. 信頼：ロールを引き受ける</text>
    <text x="44" y="165" font-size="25">Lambdaサービス</text>
    <line x1="284" y1="156" x2="348" y2="156" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="368" y="165" font-size="25">実行ロール</text>
    <rect x="24" y="220" width="592" height="128" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="44" y="255" font-size="26" font-weight="700">2. 操作許可：資源を操作する</text>
    <text x="44" y="309" font-size="25">実行ロール</text>
    <line x1="284" y1="300" x2="348" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="368" y="309" font-size="25">S3の対象キー</text>
    <rect x="24" y="364" width="592" height="128" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="44" y="399" font-size="26" font-weight="700">3. 対象認可：文書を返してよいか</text>
    <text x="44" y="453" font-size="25">認証済み利用者</text>
    <line x1="284" y1="444" x2="348" y2="444" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="368" y="453" font-size="25">対象の文書</text>
    <text x="32" y="536" font-size="23" fill="#475569">3つの問いを分ける図。処理の順番ではない。</text>
  </g>
</svg>
